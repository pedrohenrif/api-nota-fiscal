# Exemplo Nginx — painel ISMS NF (HTTP)
# DDNS atual: painel-isms-nf.ddns.net na porta 5001
# Documentação: ../DEPLOY_NGINX_HTTP.md

server {
    listen 5001;
    server_name painel-isms-nf.ddns.net;

    # Ajuste para o caminho real do build na VM
    root /caminho/para/projeto-nota-fiscal/site/dist;
    index index.html;

    client_max_body_size 10m;

    # Frontend (SPA React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API (web-api Docker em localhost:8003)
    location /api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
